  const st = hp.st;
  const mySide = st.sides.findIndex(s => s.members.includes(G.pid));
  const names = st.sides.map(s => s.name);
  if(st.ph === 'lobby' || mySide < 0){
    if(st.ffa) return `<section class="stage">
      <p class="kicker">انضمّيت لحرب</p><p class="who">${esc(hp.nick)}</p>
      <p class="sub">${st.ph === 'lobby' ? 'الكل ضد الكل. إنت جاهز، ناطرين المضيف يبلّش.' : st.sides.length >= 6 ? 'الحرب مليانة (٦ لاعبين). فيك تتفرج.' : 'عم تفوت عالحرب…'} المستوى: ${levelName(st.lv)}.</p>
    </section>`;
    const myT = st.rost[G.pid] === 0 || st.rost[G.pid] === 1 ? st.rost[G.pid] : h.myTeam;
    return `<section class="stage">
      <p class="kicker">انضمّيت لحرب</p><p class="who">${esc(hp.nick)}</p>
      <p class="sub">${st.ph === 'lobby' ? 'اختار فريقك، وناطرين المضيف يبلّش.' : 'الحرب بلّشت. اختار فريقك لتفوت.'} المستوى: ${levelName(st.lv)}.</p>
      <div class="teampick">${[0,1].map(t => `<button class="pick-team t${t}" data-action="h.pteam" data-t="${t}" aria-pressed="${myT === t}"><span class="pt-suit">${TEAM_SUIT[t]}</span><span class="pt-name">${esc(st.ph === 'lobby' ? (t ? 'الزرق' : 'الحمر') : names[t])}</span><span class="pt-goal">${myT === t ? 'إنت معهن' : (t === 0 ? 'من فوق لتحت' : 'من يمين ليسار')}</span></button>`).join('')}</div>
    </section>`;
  }
  const n = st.n, owners = st.o.split('').map(x => x === '-' ? -1 : +x), letters = st.b, shields = st.sh.split('').map(x => x === '1');
  const counts = names.map((_, s) => owners.filter(o => o === s).length);
  const myHand = st.hands[G.pid] || [];
  const myTurn = st.ph === 'choose' && st.chp === G.pid;
  const canPlaySt = type => {
    const C = CARD[type];
    if(st.ph === 'choose'){
      if(C.when !== 'choose' || st.used) return false;
      if(st.ffa ? st.chp !== G.pid : mySide !== st.chs) return false;
      const opp = (o, i) => o !== -1 && o !== mySide && !shields[i];
      if(type === 'bomb') return owners.some(opp);
      if(type === 'snatch') return st.sn !== mySide && owners.some(opp);
      if(type === 'shield') return owners.some((o, i) => o === mySide && !shields[i]);
      if(type === 'freeze') return st.sides.length > 1;
      return true;
    }
    if(st.ph === 'answer') return C.when === 'answer' && mySide === st.fl && !st.rv && (type === 'hint' ? !st.hn : !st.sw);
    return false;
  };
  const myCards = filter => myHand.filter(([u, t]) => !filter || filter(t)).map(([u, t]) => cardBtn({u, t}, '', h.sent ? 'off' : canPlaySt(t) ? 'live' : 'locked', 'h.pplay', G.pid));
  const k = st.cell >= 0 ? letters[st.cell] : '';
  const inQ = st.ph === 'question' || st.ph === 'answer' || st.ph === 'reveal';
  const canBuzz = st.ph === 'question' && mySide !== st.fz && !st.tr.includes(mySide);
  const buzzed = h.buzzN === st.gid + ':' + st.qn + ':' + st.tr.length;
  const chName = st.chs != null ? (st.ffa ? names[st.chs] : (st.names[st.chp] || names[st.chs])) : '';
  const hintLine = st.ht ? `<p class="q-hint">تلميح: ${esc(st.ht)}</p>` : '';
  let sheet = '', below = '', top = '', sel = null, action = null, dim = false;
  switch(st.ph){

        sel = i => owners[i] === -1 || (st.sn === mySide && owners[i] !== -1 && owners[i] !== mySide && !shields[i]); action = 'h.ppick';
        below = `<p class="prompt yourturn"><span>دورك! اختار حرف من اللوح${st.sn === mySide ? '، أو حرف من خلايا خصم' : ''}</span></p>`;

      if(st.pend && st.pend.pid === G.pid){
        if(st.pend.t === 'freeze') below = `<p class="prompt yourturn"><span>مين بدك تجمّد؟</span></p><div class="pickside">${names.map((nm, i) => i === mySide ? '' : `<button class="ffa-chip s${i}" data-action="h.pfreeze" data-t="${i}"><span class="fc-name">${esc(nm)}</span></button>`).join('')}</div>`;
        else { sel = i => st.pend.t === 'bomb' ? owners[i] !== -1 && owners[i] !== mySide && !shields[i] : owners[i] === mySide && !shields[i]; action = 'h.ptarget'; dim = true;
          below = `<p class="prompt yourturn"><span>${st.pend.t === 'bomb' ? 'اختار خلية لخصم لتنفجر' : 'اختار خلية إلك لتحميها'}</span></p>`; }
      } else below = `<p class="prompt"><span>عم يختاروا هدف الكرت…</span></p>`;
      break;
    case 'question':
      sheet = sheetHTML('p' + st.gid + st.qn, `${qHeadHex(k, st.q, hintLine)}${st.tot ? timerBar() : ''}
        <div class="buzzers">${buzzerBtn(mySide, names[mySide], canBuzz && !buzzed, 'h.pbuzz', buzzed ? 'كبست!' : mySide === st.fz ? 'مجمّد' : st.tr.includes(mySide) ? 'طلعت' : 'اكبس', 'big')}</div>
        ${trayHTML('كروتك', myCards(), '')}`);
      break;
    case 'answer': {
      const mine = st.fl === mySide, who = esc(st.bzn || names[st.fl]);
      let status;

      else if(st.own) status = mine ? `${who} من فريقك عم يجاوب` : `${who} عم يجاوب. إذا غلط، ${st.ffa ? 'كبوس بسرعة واسرقها' : 'السرقة إلكن'}`;
      else status = `${who} عم ${st.bzn ? 'يجاوب' : 'يجاوبوا'}`;
      sheet = sheetHTML('p' + st.gid + st.qn, `${qHeadHex(k, st.q, hintLine)}${st.tot ? timerBar() : ''}
        <p class="q-status"><span class="dot s${st.fl}"></span><span>${status}</span></p>
        ${trayHTML(mine ? 'كروتك (كروت الجواب مفتوحة هلق)' : 'كروتك', myCards(), h.note)}`);
      break;
    }
    case 'reveal': sheet = sheetHTML('p' + st.gid + st.qn, `${qHeadHex(k, st.q, '')}<p class="q-status">${esc(st.msg || 'ما حدا أخدها')} · المضيف بيقلكن الجواب</p>`); break;
    case 'double':
      if(st.dblp === G.pid){ sel = i => owners[i] === -1 && hNbrs(n, st.dblf).includes(i); action = 'h.pdouble'; dim = true; below = `<p class="prompt yourturn"><span>دبل! اختار خلية فاضية جنب «${showLetter(k)}»</span></p>`; }
      else below = `<p class="prompt"><span>دبل! عم يختاروا خلية كمان</span></p>`;
      break;
    case 'end': top = victoryHTML(names, st.win, st.ffa, st.endBy); break;
  }
  const tray = inQ ? '' : trayHTML('كروتك', myCards(), h.note);
  const board = boardSVG({n, ffa:st.ffa, owners, letters, shields, names, cur: st.cell, sel, action, dimOthers: dim, path: st.ph === 'end' ? st.path : null});
  return `<section class="hh${inQ ? ' with-sheet' : ''}">
    ${scorebarHTML({ffa:st.ffa, names, counts, chooser:st.chs, eff:{fz:st.fz, dbl:st.dbl, sn:st.sn}, phase:st.ph, mine:mySide, ids: st.ffa ? st.sides.map(sd => sd.members[0] || '') : null})}

function hValidateLocal(){
  const c = G.h.cfg;
  if(c.ffa){
    c.ffaPlayers = c.ffaPlayers.map(clean).filter(Boolean);
    if(c.ffaPlayers.length < 3) return 'لازم يكونوا ٣ لاعبين عالأقل.';
    if(new Set(c.ffaPlayers).size !== c.ffaPlayers.length) return 'في اسمين متل بعض. فرّقوا بيناتهن.';
    return '';
  }

      case 'show': if(g && g.phase === 'answer'){ g.revealed = true; hAfter(); } return;

function drawTaboo(lvl){
  let p = Bank.pool('tab', x => x.mine && lvOK(x, lvl));
  if(!p.length) p = Bank.pool('tab', x => x.lvl === lvl);
  if(!p.length){ p = Bank.all('tab', x => lvOK(x, lvl)); Bank.unmark(p.map(x => x.id)); }
  const it = pick(p); Bank.mark(it.id);
  return {id:it.id, w:it.w, f:it.f.slice()};
}
const countTaboo = lvl => Bank.pool('tab', x => lvOK(x, lvl)).length;
async function genTaboo(lvl, n){
  n = n || 20;
  const existing = Bank.all('tab', () => true).map(x => x.w).join('، ');
  const prompt = `Write ${n} NEW cards for "ممنوع تقول", an Arabic version of Taboo played by friends in Syria.
Difficulty: ${lvl === 'e' ? 'easy: everyday objects and activities everyone knows' : lvl === 'm' ? 'medium: familiar but more specific things, including Syrian daily life' : 'hard: abstract ideas, specialised things, or concepts that are hard to describe'}.
Each card has the word to describe "w" (1 to 3 words) and exactly 4 forbidden words "f": the most obvious words people would use to describe it.
Use the words Syrians actually say (Levantine colloquial is fine). No people's names, no brands, nothing political, religious or offensive.
Do not reuse any of these words: ${existing}

Reply with only a JSON array like [{"w":"قهوة","f":["فنجان","بن","ركوة","صبح"]}]`;
  const data = await genCall('tab', prompt);
  if(!Array.isArray(data)) return 0;
  const items = [];
  data.forEach(o => {
    if(!o || typeof o !== 'object') return;
    const w = str(o.w, 30), f = arrOr(o.f).map(x => str(x, 24)).filter(Boolean).slice(0, 4);
    if(w.length < 2 || f.length < 4 || new Set([w, ...f].map(norm)).size !== 5) return;
    items.push({id:'t' + hash(norm(w)), lvl, w, f});
  });
  return Bank.addGen('tab', items);
}

const T = {
  key(){ const g = G.t.game; return g ? g.phase + ':' + g.round + ':' + g.turn : 'setup'; },
  bar(){

    if(!g) return backBar('ممنوع تقول', 't.menu', '→ رجوع');
    return `<div class="bar"><span class="brand">ممنوع تقول</span><div class="bar-end">${g.phase === 'end' ? '' : `<span class="round">الجولة ${ar(g.round)} من ${ar(g.rounds)}</span>${exitBtn('t.quit', 'إنهاء')}`}</div></div>`;
  },
  view(){ const g = G.t.game; if(!g) return tSetup(); return ({ready:tReady, play:tPlay, sum:tSum, end:tEnd})[g.phase](); },
  act(a, el){
    const t = G.t, c = t.cfg, g = t.game;
    switch(a){
      case 'menu': leaveRoom(); t.view = 'menu'; render(); return;
      case 'local': t.view = 'local'; render(); return;
      case 'mp': if(roomStatus === 'off') return; t.view = 'mp'; render(); tryAutoJoin(); return;
      case 'tadd': if(c.teams.length < 4){ c.teams.push({name:TTEAM_NAMES[c.teams.length], players:['','']}); render(); focusId('tt-' + (c.teams.length - 1)); } return;
      case 'trem': if(c.teams.length > 2){ c.teams.splice(+el.dataset.t, 1); t.err = ''; render(); } return;
      case 'padd': { const tm = c.teams[+el.dataset.t]; if(tm.players.length < 6){ tm.players.push(''); render(); focusId(`tp-${el.dataset.t}-${tm.players.length - 1}`); } return; }
      case 'prem': { const tm = c.teams[+el.dataset.t]; if(tm.players.length > 2){ tm.players.splice(+el.dataset.i, 1); t.err = ''; render(); } return; }
      case 'level': c.level = el.dataset.v; render(); return;
      case 'sec': c.sec = +el.dataset.v; render(); return;
      case 'rounds': c.rounds = +el.dataset.v; render(); return;
      case 'skips': c.skips = +el.dataset.v; render(); return;
      case 'gen': genTaboo(c.level, 20).then(() => render()); return;
      case 'start': case 'again': {
        c.teams.forEach((tm,i) => { tm.name = clean(tm.name) || TTEAM_NAMES[i]; tm.players = tm.players.map(clean).filter(Boolean); while(tm.players.length < 2) tm.players.push(''); });
        if(c.teams.some(tm => tm.players.filter(Boolean).length < 2)){ t.err = 'كل فريق لازم يكون فيه لاعبين عالأقل: واحد بيوصف وواحد بيحزر.'; render(); return; }
        if(new Set(c.teams.map(tm => tm.name)).size !== c.teams.length){ t.err = 'سمّوا الفرق بأسماء مختلفة.'; render(); return; }
        t.err = ''; lsSet('sahra-tcfg', c);
        t.game = tNew(); ensureAudio(); keepAwake(); topUpTaboo(c.level); render(); return;
      }
      case 'go': if(g && g.phase === 'ready'){ tStartTurn(); render(); } return;
      case 'ok': tNext('ok'); render(); return;
      case 'no': tNext('no'); render(); return;
      case 'skip': if(g && g.skipsLeft > 0){ if(g.skips < 99) g.skipsLeft--; tNext('skip'); render(); } return;
      case 'stop': tTimeUp(); return;
      case 'edit': { const x = g && g.log[+el.dataset.i]; if(x){ x.r = x.r === 'ok' ? 'no' : x.r === 'no' ? 'skip' : 'ok'; render(); } return; }
      case 'done': {
        if(!g || g.phase !== 'sum') return;
        const tm = g.teams[g.turn];
        tm.score += tPoints(g.log); tm.next = (tm.next + 1) % tm.players.length;
        g.turn = (g.turn + 1) % g.teams.length;
        if(g.turn === 0) g.round++;
        g.phase = g.round > g.rounds ? 'end' : 'ready'; g.log = [];
        render(); return;
      }
      case 'quit': case 'setup': qTimerStop(); t.game = null; render(); return;
    }
  }
};

function paResults(id){
  switch(id){
    case 'sj': { const g = G.q.game; if(!g || g.ph === 'lobby' || !g.n) return null; const ids = Object.keys(g.scores); if(!ids.some(x => g.scores[x] > 0)) return null; return {solo:rankGroups(ids, x => g.scores[x]), names:g.nicks}; }

      const g = G.h.game; if(!g || g.mode !== 'mp' || g.phase === 'lobby' || !g.sides.length) return null;

  {id:'tab', name:'ممنوع تقول', for:'ممنوع تقول', fmt:'الكلمة | ممنوعة | ممنوعة | ممنوعة | ممنوعة'},
  {id:'word', name:'برا السالفة', for:'برا السالفة', fmt:'السالفة | الكلمة'},
  {id:'est', name:'أرقام', for:'تقدير سيف المعرفة', fmt:'السؤال | الرقم | الوحدة'}

const LV_WORD = {'سهل':'e', 'وسط':'m', 'صعب':'h'};
function freshMY(){ return {kind:'mcq', f:{lvl:'*'}, msg:'', err:'', imp:'', back:'home', all:false}; }
function parseNum(v){
  if(typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v == null ? '' : v).trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  s = s.replace(/[٬,،\s]/g, '').replace(/٫/g, '.').replace(/^[−–]/, '-');
  if(!/^-?\d+(\.\d+)?$/.test(s)) return null;
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
const fmtNum = n => n == null || !isFinite(n) ? '—' : Math.abs(n) < 10000 ? ar(String(Math.round(n*100)/100)) : ar(Math.round(n).toLocaleString('en-US'));
function letterOf(a){ const s = norm(a).replace(/^ال(?=\S\S)/, ''); const c = s.charAt(0); return LETTERS.includes(c) ? c : ''; }
/* Form fields → a question item, or an error message. */
function myBuild(kind, f){
  const t = (k, m) => str(f[k] == null ? '' : String(f[k]), m);
  const lvl = ['*','e','m','h'].includes(f.lvl) ? f.lvl : '*';
  switch(kind){
    case 'mcq': {
      const q = t('q', 220), a = t('a', 60), w = [t('w1', 60), t('w2', 60), t('w3', 60)];
      if(q.length < 4) return 'اكتب السؤال.';
      if(!a) return 'اكتب الجواب الصح.';
      if(w.some(x => !x)) return 'اكتب ٣ أجوبة غلط.';
      if(new Set([a, ...w].map(norm)).size !== 4) return 'الأجوبة الأربعة لازم تكون مختلفة.';
      return {id:'m' + hash('q|' + norm(q)), cat:'mine', lvl, q, a, w};
    }
    case 'let': {
      const q = t('q', 200), a = t('a', 50), h = t('h', 160), k = letterOf(a);
      if(q.length < 3) return 'اكتب السؤال.';
      if(!a) return 'اكتب الجواب.';
      if(!k) return 'الجواب لازم يبلش بحرف عربي.';
      if(norm(q).includes(norm(a))) return 'السؤال فيه الجواب! غيّرو شوي.';
      return {id:'m' + hash('l|' + k + '|' + norm(q)), k, lvl, q, a, h};
    }
    case 'tab': {
      const w = t('w', 30), fs = ['f1','f2','f3','f4'].map(k => t(k, 24)).filter(Boolean);
      if(!w) return 'اكتب الكلمة.';
      if(fs.length < 2) return 'اكتب كلمتين ممنوعات عالأقل.';
      return {id:'m' + hash('t|' + norm(w)), lvl, w, f:fs};
    }
    case 'word': {
      const w = t('w', 30), cat = catOf(f.cat) ? f.cat : '';
      if(!cat) return 'اختار عن شو السالفة.';
      if(!w) return 'اكتب الكلمة.';
      return {id:'m' + hash('w|' + cat + '|' + norm(w)), cat, lvl, w};
    }
    case 'est': {
      const q = t('q', 220), n = parseNum(f.n), u = t('u', 20);
      if(q.length < 4) return 'اكتب السؤال.';
      if(n == null) return 'الجواب لازم يكون رقم.';
      return {id:'m' + hash('e|' + norm(q)), lvl, q, n, u};
    }
  }
  return 'نوع مو معروف.';
}
const myFields = (kind, it) => kind === 'mcq' ? {q:it.q, a:it.a, w1:it.w[0], w2:it.w[1], w3:it.w[2], lvl:it.lvl}
  : kind === 'let' ? {q:it.q, a:it.a, h:it.h || '', lvl:it.lvl} : kind === 'tab' ? {w:it.w, f1:it.f[0], f2:it.f[1], f3:it.f[2] || '', f4:it.f[3] || '', lvl:it.lvl}
  : kind === 'word' ? {cat:it.cat, w:it.w, lvl:it.lvl} : {q:it.q, n:String(it.n), u:it.u || '', lvl:it.lvl};
/* After adding, keep the level (and the category) for the next one. */
const myKeep = (kind, f) => kind === 'word' ? {lvl:f.lvl || '*', cat:f.cat} : {lvl:f.lvl || '*'};
const lvTag = l => l === '*' ? '' : ` | ${levelName(l)}`;
function myLine(kind, it){
  switch(kind){
    case 'mcq': return [it.q, it.a, ...it.w].join(' | ') + lvTag(it.lvl);
    case 'let': return [it.q, it.a, it.h || ''].join(' | ') + lvTag(it.lvl);
    case 'tab': return [it.w, ...it.f].join(' | ') + lvTag(it.lvl);
    case 'word': return [(catOf(it.cat) || {}).name || '', it.w].join(' | ') + lvTag(it.lvl);
    case 'est': return [it.q, String(it.n), it.u || ''].join(' | ') + lvTag(it.lvl);
  }
  return '';
}
function myParseLine(kind, line){
  let p = line.split(/[|｜¦]/).map(x => x.trim());
  while(p.length && !p[p.length - 1]) p.pop();
  let lvl = '*';
  if(p.length && LV_WORD[p[p.length - 1]]){ lvl = LV_WORD[p.pop()]; }
  switch(kind){
    case 'mcq': return myBuild(kind, {q:p[0], a:p[1], w1:p[2], w2:p[3], w3:p[4], lvl});
    case 'let': return myBuild(kind, {q:p[0], a:p[1], h:p[2], lvl});
    case 'tab': return myBuild(kind, {w:p[0], f1:p[1], f2:p[2], f3:p[3], f4:p[4], lvl});
    case 'word': { const c = CATS.find(x => norm(x.name) === norm(p[0] || '') || x.id === p[0]); return myBuild(kind, {cat:c ? c.id : '', w:p[1], lvl}); }
    case 'est': return myBuild(kind, {q:p[0], n:p[1], u:p[2], lvl});
  }
  return 'نوع مو معروف.';
}

/* =========================================================
   سيف المعرفة — a war over the map of Syria (everyone on their own phone, the host plays too)
   1. Everyone gets a capital with 3 towers.
   2. Estimation questions split the rest: closest guess takes 2 regions, second takes 1.
   3. War: on your turn attack a neighbouring enemy region; you and the defender answer the same
      question. Attacker right + defender wrong = attacker takes it. Both right = a number question decides.
      Beating a capital knocks down a tower; the last tower hands over the whole country.
   Helpers, once per game: المطرقة removes two wrong answers, التلسكوب gives a range for a number.
   ========================================================= */
/* Two maps: the world (25 regions, default) and Syria (14 governorates). */
const MAPS = {world: window.SAHRA_WORLD, syria: window.SAHRA_MAP};
const MAP_IDS = ['world','syria'].filter(id => MAPS[id]);
const skM = id => MAPS[id] || MAPS[MAP_IDS[0]] || {w:400, h:300, r:[], adj:[]};
const SK_NOCAP = {syria:[0]};
/* How many regions the closest guesses take in each split round. */

function skMapSVG(o){ /* o: {map, owners[], cap[], tow[], sel(i), action, atk} */
  const M = skM(o.map), R = M.r, capAt = {}, syria = M === MAPS.syria;
  (o.cap || []).forEach((r, p) => { if(r >= 0) capAt[r] = p; });
  let paths = '', pills = '';
  R.forEach((reg, i) => {
    const ow = o.owners[i], sel = o.sel && o.sel(i);
    const cls = ['rg', ow >= 0 ? 'o' + ow : 'free'];
    if(sel) cls.push('sel'); else if(o.sel) cls.push('dim');
    if(o.atk && o.atk[2] === i) cls.push('hit');
    const attrs = sel ? ` data-action="${o.action}" data-i="${i}" role="button" tabindex="0" aria-label="${esc(reg.n)}"` : '';
    paths += `<g class="${cls.join(' ')}"${attrs}><path d="${reg.d}" fill-rule="evenodd"/></g>`;
    const [x, y] = (syria && SK_LBL[i]) || [reg.x, reg.y], isCap = i in capAt;
    const label = (isCap ? '♜ ' : '') + reg.n, w = 14 + label.length * 5.9, h = 17;
    const tw = isCap ? `<g class="towers">${[0,1,2].map(t => `<rect x="${(x - 10 + t*7.5).toFixed(1)}" y="${(y - h/2 - 7).toFixed(1)}" width="5.5" height="6" rx="1" class="${t < (o.tow[capAt[i]] || 0) ? 'up' : 'down'}"/>`).join('')}</g>` : '';
    pills += `<g class="pill${ow >= 0 ? ' o' + ow : ' free'}${sel ? ' sel' : ''}${isCap ? ' cap' : ''}"${attrs}>${tw}<rect class="pr" x="${(x - w/2).toFixed(1)}" y="${(y - h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h}" rx="8.5"/><text x="${x}" y="${y}" dy=".36em">${esc(label)}</text></g>`;
  });
  return `<svg class="syrmap${syria ? '' : ' world'}" viewBox="0 0 ${M.w} ${M.h}" role="group" aria-label="${syria ? 'خريطة سوريا' : 'خريطة العالم'}">${paths}${pills}</svg>`;
}
/* The map in its frame. The world map is wider than a phone, so it scrolls sideways and
   starts centred on what matters right now (focus: region indexes). */
function skMapBox(o, focus, key){
  const M = skM(o.map), wide = M !== MAPS.syria;
  let fx = 0.58;
  const pts = (focus || []).filter(i => M.r[i]);
  if(pts.length) fx = pts.reduce((s, i) => s + M.r[i].x, 0) / pts.length / M.w;
  return `<div class="mapwrap${wide ? ' wide' : ''}" dir="ltr"${wide ? ` data-fx="${fx.toFixed(3)}" data-key="${esc(key || '')}"` : ''}>${skMapSVG(o)}</div>`;
}
let mapScrollKey = '';
function scrollMaps(){
  $app.querySelectorAll('.mapwrap.wide[data-fx]').forEach(el => {
    const key = el.dataset.key || '';
    if(key && key === mapScrollKey) return;
    mapScrollKey = key;
    try{ el.scrollLeft = Math.max(0, +el.dataset.fx * el.scrollWidth - el.clientWidth / 2); }catch(e){}
  });
}
function skChips(st, owners){
  return `<div class="sk-chips">${st.pl.map(([id, nm], i) => {
    const n = owners.filter(o => o === i).length, dead = !st.alive[i], cur = st.cur === id;
    return `<div class="sk-chip s${i}${cur ? ' cur' : ''}${dead ? ' dead' : ''}${id === G.pid ? ' me' : ''}">${avHTML(id, 'sm')}<span class="skc-name">${esc(nm)}${id === G.pid ? ' <small>(إنت)</small>' : ''}</span>
      <span class="skc-n">${ar(n)}</span><span class="skc-tow" aria-label="أبراج العاصمة">${[0,1,2].map(t => `<i class="${t < st.tow[i] ? 'up' : ''}"></i>`).join('')}</span></div>`;
  }).join('')}</div>`;
}
function skHelpBtns(st, kind){
  const i = st.pl.findIndex(p => p[0] === G.pid); if(i < 0) return '';
  const h = st.help[i] || [0, 0];
  if(kind === 'ham') return `<button class="sk-help" data-action="k.ham"${h[0] && !st.ham[G.pid] ? '' : ' disabled'}>🔨 المطرقة <small>${h[0] ? 'شيل جوابين غلط' : 'استعملتها'}</small></button>`;
  return `<button class="sk-help" data-action="k.tel"${h[1] && !st.tel[G.pid] ? '' : ' disabled'}>🔭 التلسكوب <small>${h[1] ? 'بيعطيك مجال الجواب' : 'استعملتو'}</small></button>`;
}
function skView(st, host, hostName){
  const k = G.sk, me = G.pid, myI = st.pl.findIndex(p => p[0] === me);
  const nm = id => (st.pl.find(p => p[0] === id) || st.lobby.find(p => p[0] === id) || [0, 'لاعب'])[1];
  if(st.ph === 'lobby') return skLobby(st, host, hostName);
  const owners = st.own.split('').map(c => c === '-' ? -1 : +c);
  const ownIds = owners.map(o => o >= 0 && st.pl[o] ? st.pl[o][0] : '');
  const aliveId = id => { const i = st.pl.findIndex(p => p[0] === id); return i >= 0 && !!st.alive[i]; };
  const timer = st.tot ? '<div class="q-timer"><div class="tbar" id="qbar"><i></i></div><span class="secs" id="qsecs"></span></div>' : '';
  const cont = label => host ? `<div class="dock"><button class="primary" data-action="k.cont">${label}</button></div>` : '';
  const M = skM(st.map);
  const head = `<div class="sk-head"><span class="tag">${st.round ? `الحرب · جولة ${ar(Math.min(st.round, st.rounds))} من ${ar(st.rounds)}` : 'تقسيم الخريطة'}</span></div>${skChips(st, owners)}`;

  const myCap = myI >= 0 && st.cap[myI] >= 0 ? [st.cap[myI]] : [];
  const mapPlain = () => skMapBox({map:st.map, owners, cap:st.cap, tow:st.tow, atk:st.atk}, myCap, 'end' + st.gid);
  const pc = skPickCounts(st.map, st.pl.length);
  const sentHere = k.sent !== '' && k.sentQ === st.qn, inWho = st.who.includes(me), answered = st.got.includes(me) || sentHere;
  switch(st.ph){
    case 'est': case 'tb': {
      const tel = st.tel[me];
      const title = st.ph === 'tb' ? `سؤال حسم بين ${esc(nm(st.who[0]))} و${esc(nm(st.who[1]))}` : `سؤال أرقام: الأقرب بياخد ${skRegionsWord(pc[0])}، والتاني ${skRegionsWord(pc[1] || 1)}`;

      if(!inWho) body = `<p class="count-line">عم يجاوبوا… (${ar(st.got.length)} من ${ar(st.who.length)})</p>`;
      else if(answered) body = `<div class="banner neutral"><b dir="ltr">${sentHere ? fmtNum(parseNum(k.sent)) : 'جاوبت'}</b><span>تمام! ناطرين الباقيين…</span></div>`;
      else body = `${tel ? `<p class="sk-tel">🔭 الجواب بين <b>${fmtNum(tel[0])}</b> و<b>${fmtNum(tel[1])}</b></p>` : ''}
        <div class="numrow"><input class="input numin" id="skv" data-field="skv" inputmode="decimal" dir="ltr" autocomplete="off" value="${esc(k.inputQ === st.qn ? k.input : '')}" placeholder="رقمك" aria-label="جوابك"><span class="unit">${esc(st.q.u || '')}</span></div>
        <button class="primary" data-action="k.est">ثبّت جوابي</button>${skHelpBtns(st, 'tel')}`;
      return `<section class="stage top sk">${head}${timer}<p class="kicker">${title}</p><p class="qtext-big">${esc(st.q.t)}</p>${body}</section>`;
    }
    case 'estrev': case 'tbrev': {
      const rows = st.res.map(([id, v], i) => `<li class="${i === 0 && v != null ? 'best' : ''}">${avHTML(id, 'sm')}<span class="er-name">${esc(nm(id))}</span><span class="er-v" dir="ltr">${v == null ? '—' : fmtNum(v)}</span><span class="er-d">${v == null ? 'ما جاوب' : 'فرق ' + fmtNum(Math.abs(v - st.q.n))}</span></li>`).join('');
      const groups = []; st.picks.forEach(id => { const l = groups[groups.length - 1]; if(l && l[0] === id) l[1]++; else groups.push([id, 1]); });
      const note = st.ph === 'estrev' ? (groups.length ? `<p class="sub">${groups.map(([id, n]) => `<b>${esc(nm(id))}</b> بياخد ${skRegionsWord(n)}`).join('، ')}.</p>` : '') : `<p class="sub"><b>${esc(nm(st.tbw))}</b> ربح المعركة.</p>`;
      return `<section class="stage top sk">${head}
        <p class="qtext-big">${esc(st.q.t)}</p>
        <div class="er-ans"><span>الجواب</span><b dir="ltr">${fmtNum(st.q.n)}</b><span>${esc(st.q.u || '')}</span></div>

      </section>${cont(st.ph === 'estrev' ? 'يلا نختار المناطق' : 'كمّل')}`;
    }
    case 'pick': {
      const mine = st.cur === me, opts = mine ? skPickable(M, ownIds, me) : [];
      return `<section class="stage top sk">${head}${timer}
        <p class="prompt${mine ? ' yourturn' : ''}"><span>${mine ? `دورك! اختار منطقة فاضية${st.picks.filter(x => x === me).length > 1 ? ` (باقيلك ${skRegionsWord(st.picks.filter(x => x === me).length)})` : ''}` : `${esc(nm(st.cur))} عم يختار منطقة`}</span></p>
        ${skMapBox({map:st.map, owners, cap:st.cap, tow:st.tow, sel: mine ? (i => opts.includes(i)) : null, action:'k.pick'}, mine ? opts : myCap, 'p' + st.gid + st.qn + st.cur + (mine ? 'm' : ''))}
        ${mine ? `<div class="sk-opts">${opts.map(i => `<button class="chip" data-action="k.pick" data-i="${i}">${esc(M.r[i].n)}</button>`).join('')}</div>` : ''}

    }
    case 'turn': {
      const mine = st.cur === me, opts = mine ? skTargets(M, ownIds, me, aliveId) : [];
      return `<section class="stage top sk">${head}${timer}
        <p class="prompt${mine ? ' yourturn' : ''}"><span>${mine ? 'دورك تهاجم! اختار منطقة خصم جنب أرضك' : `${esc(nm(st.cur))} عم يختار مين يهاجم`}</span></p>
        ${skMapBox({map:st.map, owners, cap:st.cap, tow:st.tow, sel: mine ? (i => opts.includes(i)) : null, action:'k.atk'}, mine ? opts : myCap, 't' + st.gid + st.round + st.cur + (mine ? 'm' : ''))}
        ${mine ? `<div class="sk-opts">${opts.map(i => `<button class="chip" data-action="k.atk" data-i="${i}">${esc(M.r[i].n)} <small>(${esc(nm(ownIds[i]))})</small></button>`).join('')}</div>` : ''}
        ${msg}</section>`;
    }
    case 'duel': case 'duelrev': {
      const [a, d, r, isCap] = st.atk || ['', '', -1, 0];
      const vs = `<div class="sk-vs"><span class="sv s${st.pl.findIndex(p => p[0] === a)}">${avHTML(a, 'sm')}${esc(nm(a))}</span><span class="sv-x">⚔</span><span class="sv s${st.pl.findIndex(p => p[0] === d)}">${avHTML(d, 'sm')}${esc(nm(d))}</span></div>
        <p class="kicker">معركة على ${esc((M.r[r] || {}).n || '')}${isCap ? ' · عاصمة!' : ''}</p>`;
      if(st.ph === 'duel'){
        const struck = st.ham[me] || [];
        const myPick = sentHere ? +k.sent : null;
        const locked = !inWho || answered;
        return `<section class="stage top sk">${vs}${timer}<p class="qtext-big">${esc(st.q.t)}</p>
          ${answersHTML({opts:st.q.o, action: inWho ? 'k.ans' : 'k.none', mine: myPick, struck, locked})}
          ${inWho && !answered ? skHelpBtns(st, 'ham') : `<p class="count-line">${inWho ? 'جاوبت! ناطرين…' : `عم يتقاتلوا… (${ar(st.got.length)} من ٢)`}</p>`}
        </section>`;
      }
      const who = [0,1,2,3].map(pos => [[a, st.da], [d, st.dd]].filter(x => x[1] === pos).map(x => ({id:x[0], name:nm(x[0])})));
      const res = st.dres ? (st.dres[0] && st.dres[1] ? 'التنين صح! سؤال أرقام بيحسم' : st.dres[0] ? `${esc(nm(a))} ربح!` : `${esc(nm(d))} صمد!`) : '';
      return `<section class="stage top sk">${vs}<p class="qtext-big">${esc(st.q.t)}</p>
        ${answersHTML({opts:st.q.o, action:'k.none', cor:st.cor, revealed:true, who})}
        <div class="banner ${st.dres && st.dres[0] && !st.dres[1] ? 'good' : 'neutral'}"><b>${res}</b></div>
      </section>${cont(st.dres && st.dres[0] && st.dres[1] ? 'سؤال الحسم' : 'كمّل')}`;
    }
    case 'end': {
      const w = st.win;
      return `<section class="stage top sk">
        <div class="victory"><span class="v-kicker">خلصت الحرب</span><span class="v-title">${w ? `${esc(nm(w))} ربح!` : 'تعادل!'}</span><span class="v-sub">الأكتر مناطق</span></div>
        ${mapPlain()}
        ${boardHTML(st.rank.map(([id, n]) => ({name:nm(id), total:n, delta:0, me:id === me, pid:id})), 'المناطق')}
      </section>${host ? '<div class="dock"><button class="primary" data-action="k.again">لعبة جديدة</button></div>' : ''}`;
    }
  }
  return '';
}

const SK = {
  key(){ const k = G.sk; if(k.role === 'host' && k.game) return 'kh:' + k.game.phase + ':' + k.game.qn + ':' + k.game.turn; if(k.role === 'player') return 'kp:' + (k.hostSt ? k.hostSt.ph + ':' + k.hostSt.qn : 'w'); return 'kj'; },
  bar(){
    const k = G.sk;

    if(k.role === 'host') return `<div class="bar"><span class="brand">سيف المعرفة</span><div class="bar-end">${exitBtn('k.endhost', 'إنهاء')}</div></div>`;

  },
  view(){
    const k = G.sk;
    if(k.role === 'host' && k.game) return skView(cleanSk(JSON.parse(JSON.stringify(skSt()))), true, G.nick);
    if(k.role === 'player'){
      const hp = hostPeerOf('sk', k.hostPid, cleanSk);
      if(!hp || !hp.st) return mpGone(k.hostNick, 'k.leave');

  },
  act(a, el){
    const k = G.sk, g = k.game, host = k.role === 'host';
    const me = G.pid, qn = skQn();
    const send = act => { mpAct(k, act); render(); };
    switch(a){
      case 'host': if(mpJoinCommon(k, 'sk', null)){ k.role = 'host'; k.game = skNew(); skSig = ''; skSync(true); keepAwake(); render(); } return;
      case 'join': if(mpJoinCommon(k, 'sk', el)) render(); return;
      case 'leave': case 'endhost': leaveRoom(); render(); return;
      case 'level': k.cfg.level = el.dataset.v; render(); return;
      case 'rounds': k.cfg.rounds = +el.dataset.v; render(); return;
      case 'qsec': k.cfg.qsec = +el.dataset.v; render(); return;
      case 'map': if(MAP_IDS.includes(el.dataset.v)){ k.cfg.map = el.dataset.v; if(host && g && g.phase === 'lobby') g.map = k.cfg.map; skSync(); render(); } return;
      case 'start': if(host && g.phase === 'lobby'){ k.err = skStart(g); ensureAudio(); keepAwake(); skAfter(); } return;
      case 'again': if(host){ skDisarm(g); k.game = skNew(); skSig = ''; skAfter(); } return;
      case 'cont': if(host && skCont(g)) skAfter(); return;
      case 'none': return;
      case 'est': {
        if(k.sent !== '' && k.sentQ === qn) return;
        const v = parseNum(k.inputQ === qn ? k.input : '');

        k.sent = String(v); k.sentQ = qn;
        if(host){ skEstAns(g, me, v); skAfter(); } else send({t:'est', n:qn, v});
        return;
      }
      case 'ans': {
        if(k.sent !== '' && k.sentQ === qn) return;
        const c = +el.dataset.c;
        k.sent = String(c); k.sentQ = qn;
        if(host){ skMcqAns(g, me, c); skAfter(); } else send({t:'mcq', n:qn, c});
        return;
      }
      case 'ham': if(host){ if(skHam(g, me)) skAfter(); } else send({t:'ham', n:qn}); return;
      case 'tel': if(host){ if(skTel(g, me)) skAfter(); } else send({t:'tel', n:qn}); return;
      case 'pick': { const i = +el.dataset.i; if(host){ if(skDoPick(g, me, i)) skAfter(); } else send({t:'pick', i}); return; }
      case 'atk': { const i = +el.dataset.i; if(host){ if(skAttack(g, me, i)) skAfter(); } else send({t:'atk', i}); return; }
    }
  }
};

/* =========================================================
   Render + events
   ========================================================= */
let lastHTML = '', lastKey = '', armTimer = null;
function currentKey(){ return G.app + ':' + (G.app === 'party' ? PA.key() : G.app === 'sword' ? SK.key() : G.app === 'mine' ? MY.key() : G.app === 'salfeh' ? (G.s.view === 'mp' ? BS.key() : G.s.view + G.s.screen) : G.app === 'quiz' ? Q.key() : G.app === 'huroof' ? HH.key() : G.app === 'taboo' ? (G.t.view === 'mp' ? MT.key() : G.t.view + T.key()) : ''); }
function render(){
  if(!G) return;
  let inner;
  if(G.app === 'home') inner = homeView();
  else if(G.app === 'salfeh') inner = G.s.view === 'menu' ? backBar('برا السالفة', 'h.home', '→ كل الألعاب') + salfehMenu() : G.s.view === 'mp' ? BS.bar() + BS.view() : sBar() + S_VIEWS[G.s.screen]();
  else if(G.app === 'quiz') inner = Q.bar() + Q.view();
  else if(G.app === 'taboo') inner = G.t.view === 'menu' ? backBar('ممنوع تقول', 'h.home', '→ كل الألعاب') + tabooMenu() : G.t.view === 'mp' ? MT.bar() + MT.view() : T.bar() + T.view();
  else if(G.app === 'party') inner = PA.bar() + PA.view();
  else if(G.app === 'sword') inner = SK.bar() + SK.view();
  else if(G.app === 'mine') inner = MY.bar() + MY.view();
  else inner = HH.bar() + HH.view();
  const html = `<div class="wrap">${paStrip()}${inner}</div>`;
  if(html === lastHTML) return;
  const ae = document.activeElement;
  const fid = ae && ae.id && $app.contains(ae) ? ae.id : null;
  let s0 = null, s1 = null;
  if(fid && ae.tagName === 'INPUT'){ try{ s0 = ae.selectionStart; s1 = ae.selectionEnd; }catch(e){} }
  const openDetails = [...$app.querySelectorAll('details[open]')].map(d => d.id).filter(Boolean);
  const hands = [...$app.querySelectorAll('.hand')].map(x => x.scrollLeft);
  $app.innerHTML = html; lastHTML = html;
  openDetails.forEach(id => { const d = document.getElementById(id); if(d) d.open = true; });
  [...$app.querySelectorAll('.hand')].forEach((x,i) => { if(hands[i]) x.scrollLeft = hands[i]; });
  if(fid){ const n = document.getElementById(fid); if(n){ try{ n.focus({preventScroll:true}); if(s0 != null) n.setSelectionRange(s0, s1); }catch(e){} } }
  const key = currentKey();
  if(key !== lastKey){ window.scrollTo(0, 0); lastKey = key; }
  if(G.app === 'salfeh' && G.s.view === 'local'){
    if(G.s.screen === 'play') sTimerUI();
    if(G.s.screen === 'reveal' && !G.s.r.revealShown){
      const c = document.getElementById('reveal-card');
      requestAnimationFrame(() => requestAnimationFrame(() => { if(c) c.classList.add('is-flipped'); if(G.s.r) G.s.r.revealShown = true; }));
    }
  }
  if(G.app !== 'home') qTimerPaint();
  fitPills();
  scrollMaps();
}
/* Size each region label on the map to its text, and keep it inside the map. */
function fitPills(){
  $app.querySelectorAll('.syrmap .pill').forEach(g => {
    try{
      const svg = g.ownerSVGElement, W = svg && svg.viewBox && svg.viewBox.baseVal ? svg.viewBox.baseVal.width : 400;
      const t = g.querySelector('text'), r = g.querySelector('rect.pr');
      if(!t || !r || !t.getComputedTextLength) return;
      const w = t.getComputedTextLength() + 14, x = +t.getAttribute('x');
      if(!(w > 14)) return;
      r.setAttribute('x', (x - w/2).toFixed(1)); r.setAttribute('width', w.toFixed(1));
      const dx = x - w/2 < 2 ? 2 - (x - w/2) : x + w/2 > W - 2 ? (W - 2) - (x + w/2) : 0;
      if(dx) g.setAttribute('transform', `translate(${dx.toFixed(1)},0)`);
    }catch(e){}
  });
}
function focusId(id){ const el = document.getElementById(id); if(el) el.focus(); }

$app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el || el.disabled) return;
  const a = el.dataset.action;
  if(el.dataset.confirm && G.armed !== a){
    G.armed = a;
    el.classList.add('armed'); el.textContent = 'أكيد؟ اضغط كمان مرة';
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { if(G.armed === a){ G.armed = null; render(); } }, 3000);
    return;
  }
  if(G.armed){ G.armed = null; clearTimeout(armTimer); }
  const i = a.indexOf('.'), ns = a.slice(0, i), act = a.slice(i + 1);
  /* In a party, ending a game takes the host back to the party lobby. */
  if(act === 'endhost' && G.pa.role === 'host'){ paReturn(); return; }
  if(ns === 'h' && ['home','salfeh','quiz','huroof','taboo','party','sword'].includes(act)) H.act(act, el);
  else if(ns === 'p') PA.act(act, el);
  else if(ns === 'k') SK.act(act, el);
  else if(ns === 'y') MY.act(act, el);
  else if(ns === 'x' && act === 'av') setAvatar(+el.dataset.v);
  else if(ns === 't') T.act(act, el);
  else if(ns === 'b') BS.act(act, el);
  else if(ns === 'm') MT.act(act, el);
  else if(ns === 's') S.act(act, el);
  else if(ns === 'q') Q.act(act, el);
  else if(ns === 'h') HH.act(act, el);
  else if(ns === 'x' && act === 'copy'){
    const text = el.dataset.text || '';
    const done = () => { el.textContent = 'انسخ'; setTimeout(() => { el.textContent = 'نسخ'; }, 1500); };
    const fallback = () => { const code = document.getElementById('joinlink'); if(code){ const r = document.createRange(); r.selectNodeContents(code); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } };
    try{ navigator.clipboard.writeText(text).then(done, fallback); }catch(err){ fallback(); }
  }
});
$app.addEventListener('keydown', e => {
  const t = e.target;
  if((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button' && t.dataset && t.dataset.action && t.tagName !== 'BUTTON'){
    e.preventDefault(); t.dispatchEvent(new MouseEvent('click', {bubbles:true})); return;
  }
  if(e.key !== 'Enter' || !t.dataset || !t.dataset.field) return;
  const f = t.dataset.field;
  if(f === 'nick' || f === 'hteam' || f === 'hplayer' || f === 'hffa' || f === 'tteam' || f === 'tplayer'){ e.preventDefault(); t.blur(); return; }
  if(f === 'skv'){ e.preventDefault(); SK.act('est', t); return; }
  if(f === 'myimp') return;
  if(f === 'my'){
    e.preventDefault();
    const form = t.closest('.myform'), ins = form ? [...form.querySelectorAll('input')] : [], k = ins.indexOf(t);
    if(k >= 0 && k < ins.length - 1) ins[k + 1].focus(); else t.blur();
    return;
  }
  e.preventDefault();
  const i = +t.dataset.i;
  const list = f === 'player' ? G.s.players : G.q.lcfg.teams;
  const max = f === 'player' ? 12 : 4, prefix = f === 'player' ? 'p-' : 't-';
  if(i === list.length - 1){ if(list.length < max){ list.push(''); render(); focusId(prefix + (i + 1)); } else t.blur(); }
  else focusId(prefix + (i + 1));
});
$app.addEventListener('input', e => {
  const t = e.target, f = t.dataset.field;
  if(!f) return;
  const clearErr = st => { if(st.err || st.error){ st.err = ''; st.error = ''; const er = $app.querySelector('.err'); if(er) er.remove(); } };
  if(f === 'player'){ G.s.players[+t.dataset.i] = t.value; clearErr(G.s); }
  else if(f === 'nick'){ G.nick = t.value; clearErr(G.q); clearErr(G.h); }
  else if(f === 'team'){ G.q.lcfg.teams[+t.dataset.i] = t.value; }
  else if(f === 'hteam'){ G.h.cfg.teams[+t.dataset.t].name = t.value; if(G.h.game && G.h.game.phase === 'lobby') G.h.game.teams[+t.dataset.t].name = clean(t.value) || G.h.game.teams[+t.dataset.t].name; }
  else if(f === 'hplayer'){ G.h.cfg.teams[+t.dataset.t].players[+t.dataset.i] = t.value; clearErr(G.h); }
  else if(f === 'hffa'){ G.h.cfg.ffaPlayers[+t.dataset.i] = t.value; clearErr(G.h); }
  else if(f === 'tteam'){ G.t.cfg.teams[+t.dataset.t].name = t.value; clearErr(G.t); }
  else if(f === 'tplayer'){ G.t.cfg.teams[+t.dataset.t].players[+t.dataset.i] = t.value; clearErr(G.t); }
  else if(f === 'my'){
    const pq = t.dataset.ctx === 'pq', st = pq ? G.pa.qf : G.my.f;
    st[t.dataset.k] = t.value;
    if(pq){ G.pa.qerr = ''; G.pa.qmsg = ''; } else { G.my.err = ''; G.my.msg = ''; }
    const er = $app.querySelector('.myform ~ .err, .myform ~ .okmsg'); if(er) er.remove();
    if(t.dataset.k === 'a' && (pq ? G.pa.qkind : G.my.kind) === 'let'){ lastHTML = ''; render(); return; }
  }
  else if(f === 'myimp'){ G.my.imp = t.value; }
  else if(f === 'skv'){ G.sk.input = t.value; G.sk.inputQ = skQn(); }
  lastHTML = '';
});
$app.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset && t.dataset.field === 'hteam' && G.h.role === 'host'){ hhSync(true); }
  if(t.dataset && t.dataset.field === 'nick'){ tryAutoJoin(); }
});

/* =========================================================
   Boot (keeps a game in progress across page updates)
   ========================================================= */
/* A join link (#sj-… or #hh-…) opens that game's join screen and joins as soon as the host is seen. */
function applyJoinHash(){
  const m = /^#(sj|hh|bs|mt|sk|pa)-([a-z0-9]{6,16})$/.exec(location.hash || '');
  if(!m) return false;
  if(G.join && G.join.app === m[1] && G.join.pid === m[2] && G.joinTried) return false;
  if(G.pa.role && G.pa.hostPid === m[2]) return false;
  if(G.q.role || G.h.role || G.bs.role || G.mt.role || G.sk.role || G.pa.role) leaveRoom();
  G.join = {app:m[1], pid:m[2]}; G.joinTried = false;
  const d = mpDef(m[1]);
  G.app = d.key; d.vs().view = 'mp';
  return true;
}
function boot(data){
  const restored = !!(data && data.G && data.G.v === 6);
  G = restored ? data.G : freshG();
  G.armed = null;
  ensurePid();
  if(!restored){ applyJoinHash(); paRejoin(); }
  window.addEventListener('hashchange', () => {
    if(!applyJoinHash()) return;
    lastKey = ''; render(); tryAutoJoin();
  });
  try{ if(window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({G})); }catch(e){}
  const r = G.s.r;
  if(r && r.running){ r.endAt = Date.now() + r.timeLeft*1000; sRunTicker(); }
  const q = G.q;
  if(q.role === 'host' && q.game && q.game.ph === 'q') qTimerStart('h' + q.game.n, q.game.startAt + q.game.dur*1000, q.game.dur*1000, hostReveal);
  if(q.view === 'local' && q.L && q.L.dur && (q.L.phase === 'q' || q.L.phase === 'steal')){
    const steal = q.L.phase === 'steal';
    qTimerStart((steal ? 's' : 'l') + q.L.qi, q.L.endAt, (steal ? STEAL_SEC : q.L.dur)*1000, steal ? lStealTimeout : lTimeout);
  }
  q.prep = false;
  const hg = G.h.game;
  if(hg && (hg.phase === 'question' || hg.phase === 'answer') && hg.qEnd && G.h.role !== 'player') qTimerStart('hq' + hg.gid + hg.qn + hg.phase, hg.qEnd, hg.qTotal || 10000, hg.phase === 'answer' ? hATimeout : hQTimeout);
  const kg = G.sk.game;
  if(kg && G.sk.role === 'host') skRearm(kg);
  const tg = G.t.game;
  if(tg && tg.phase === 'play') qTimerStart('tb' + tg.round + '-' + tg.turn, tg.endAt, tg.sec*1000, tTimeUp);
  render();
  initRoom();
  initSample();
  try{ Object.defineProperty(window, '__sahra', {value:{get G(){ return G; }, peers: () => peersList(), resync: () => reassertPresence()}}); }catch(e){}
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
